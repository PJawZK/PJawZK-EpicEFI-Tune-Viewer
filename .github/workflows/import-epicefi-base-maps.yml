          ]

          def download(name, destination):
              url = BASE + urllib.parse.quote(name)
              print('GET', url)
              with urllib.request.urlopen(url, timeout=120) as response:
                  data = response.read()
              destination.write_bytes(data)

          sig_re = re.compile(br'<versionInfo\b[^>]*\bsignature\s*=\s*["\']([^"\']+)["\']', re.I)

          imported = []
          ROOT.mkdir(parents=True, exist_ok=True)

          for profile in profiles:
              folder = ROOT / profile['id']
              if folder.exists():
                  shutil.rmtree(folder)
              folder.mkdir(parents=True)

              msq_name = profile['stem'] + '.msq'
              ini_name = profile['stem'] + '.ini'
              msq_path = folder / 'tune.msq'
              ini_path = folder / 'mainController.ini'
              download(msq_name, msq_path)
              download(ini_name, ini_path)

              match = sig_re.search(msq_path.read_bytes())
              if not match:
                  raise RuntimeError(f"No firmware signature in {msq_name}")
              signature = match.group(1).decode('latin-1').strip()

              metadata = {k: v for k, v in profile.items() if k != 'stem'}
              metadata.update({
                  'firmwareSignature': signature,
                  'validationStatus': 'Unverified',
                  'classification': 'Base Tune',
                  'versionLabel': 'EpicEFI Base Map',
                  'files': {'msq': 'tune.msq', 'ini': 'mainController.ini'},
              })
              if 'notes' not in metadata:
                  metadata['notes'] = f"Imported from the EpicEFI base-map library. Original label: {profile['stem']}."
              (folder / 'metadata.json').write_text(json.dumps(metadata, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              imported.append((profile['id'], profile['stem'], signature))

          notes = """# EpicEFI base-map import

Source: https://content.epicefi.com/base_maps/

This directory's published tune folders include the complete root-level MSQ+INI pairs from the EpicEFI base-map library as of 2026-09-11. They are cataloged as **Base Tune / Unverified** profiles. Metadata is intentionally conservative and primarily inferred from the source filename plus any accompanying source TXT description.

Not imported into the usable Tune Hub catalog:

- `Dcwerx - Subaru 6-7 basemap.ini` — INI only; no matching MSQ is present in the base-map root.
- `Immrpablo - KAMARO - k24a4 vtec killer no vvt - NA Ignition table.msq` — MSQ only; its signature (`rusEFI master.2024.10.18.uaefi.1537376161`) is not currently present in the Tune Viewer definition registry.
- `incomplete/` — intentionally excluded because the source site labels it incomplete.
- `partials/` — intentionally excluded because these are table/partial snippets rather than complete tune profiles.

The original source labels are retained in each profile's notes for traceability.
"""
          (ROOT / 'BASE_MAP_IMPORT_NOTES.md').write_text(notes, encoding='utf-8')

          print(f'Imported {len(imported)} complete base-map profiles')
          for item in imported:
              print(' | '.join(item))
          PY

      - name: Validate catalog and build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npm run build

      - name: Commit imported profiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tunes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: import EpicEFI base-map profiles"
          git push origin HEAD:import-epicefi-base-maps-20260911
