name: One-off branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete remaining stale branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/v0.11-metadata-validation-audit',
            });
            core.notice('Deleted v0.11-metadata-validation-audit');
