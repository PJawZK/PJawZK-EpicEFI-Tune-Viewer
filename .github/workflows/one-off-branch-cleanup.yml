name: One-off branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete audited stale branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branches = ["firmware-milestone-audit-20260911","firmware-milestone-definitions-20260911","fix/cloudflare-worker-editor-diagnostics","fix/github-installation-token-scope","fix/public-submission-error-logging","import-epicefi-base-maps-20260911","submission-fixes","tmp-firmware-archive-20260911","tmp-firmware-archive-build-20260911","tmp-firmware-artifact-split-20260911","v0.1-browser-viewer","v0.1.1-dynamic-ini-labels","v0.10-tune-hub-discovery","v0.10.1-structured-collections","v0.10.2-richer-tune-presentation","v0.11-direct-write-hardening","v0.11-field-validation-feedback","v0.11-metadata-validation-audit","v0.11-public-size-preflight","v0.11-public-submission-copy","v0.11-publication-hardening","v0.11-repository-metadata-limits","v0.11-structure-auth-ux","v0.11-submission-length-guard","v0.11-trusted-writer-archive-tune","v0.11-trusted-writer-remove-tune","v0.11-write-recovery-collisions","v0.12-compare-entry-points","v0.12-compare-published-tunes","v0.12-compare-stored-ini","v0.12-definition-history-compare","v0.12-firmware-intelligence","v0.12-public-submission-foundation","v0.2-auto-definitions","v0.3-tune-browser","v0.3.1-curve-rendering","v0.4-tune-hub","v0.5-submit-tune","v0.5.1-metadata-autofill","v0.5.2-metadata-selects","v0.6-definition-pipeline","v0.7-definition-hub","v0.8-tune-compare","v0.8.1-direct-github-submit","v0.8.2-direct-main-submit","v0.8.3-select-fix-token-help","v0.8.4-custom-dropdowns-upload-fix","v0.8.5-edit-published-tune","v0.8.5.1-live-main-edits","v0.9-lineage-revisions","v0.9.1-author-pages","v0.9.1.1-author-link-style","v0.9.2-history-polish","v1-rc-hardening"];
            const deleted = [];
            const alreadyGone = [];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                deleted.push(branch);
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  alreadyGone.push(branch);
                  continue;
                }
                core.error(`Failed to delete ${branch}: ${error.message}`);
                throw error;
              }
            }
            core.notice(`Deleted ${deleted.length} branches.`);
            if (alreadyGone.length) {
              core.notice(`Already absent: ${alreadyGone.join(', ')}`);
            }
