[PortEditor]
				; map the arrays and supply the labels.
				; all arrays are expected to be the same length in the first dimension
				; thus a [ 7] array will be 7 ports in length and expect 7 labels
				; The second dimension will drive the number of conditions per array.
				; thus a [7x2] array will have 2 conditions joined by the conditionRelationship.
				; a [7x3] will have up to 3 conditions.
				; 1st the array constant, then the labels in the index order.
				; new CAN id, optional if psCanId is set to a valid array equal in size to
				;outputOffset, it will be in the UI.
				; operator will be sent to the controller
				; optional CAN ID of the target controller.
				; the actual ASCII value of the
			; outputCanId 		= psCanId

			portEditor 			= std_port_edit, "Output port Settings"
			topicHelp 			= "http://www.megamanual.com/mt28.htm#sp"
			enabledPorts 		= portsEnabled, "PA0", "PA1", "PA2", "PA3", "PA4", "PA5", "PA6", "PA7", "PA8", "PA9", "PA10", "PA11", "PA12", "PA13", "PA14", "PA15", "PB0", "PB1", "PB2", "PB3", "PB4", "PB5", "PB6", "PB7", "PB8", "PB9", "PB10", "PB11", "PB12", "PB13", "PB14", "PB15", "PC0", "PC1", "PC2", "PC3", "PC4", "PC5", "PC6", "PC7", "PC8", "PC9", "PC10", "PC11", "PC12", "PC13", "PC14", "PC15", "PD0", "PD1", "PD2", "PD3", "PD4", "PD5", "PD6", "PD7", "PD8", "PD9", "PD10", "PD11", "PD12", "PD13", "PD14", "PD15"
			operators 			= portsCondition, "<", "=", ">", "&", "!"
			threshold 			= portsThreshold
			hysteresis 			= portsHysteresis
			powerOnValue 		= portsPowerOnValue
			triggerValue 		= portsTriggerValue
			outputOffset 		= portsReadOffset
			outputSize 			= portsSize
			portActiveDelay     = portsActiveDelay
			portInactiveDelay	= portsInactiveDelay
			outputName			= portsOutputName
			conditionRelationship = portsConnector, " ", "|", "&"
			activateOption = extendedDataInSize ; Will place sign and type flags in upper nibble of outputSize

